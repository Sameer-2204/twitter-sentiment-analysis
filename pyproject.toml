[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

# ──────────────────────────────────────────────
# Project metadata  (PEP 621)
# ──────────────────────────────────────────────
[project]
name = "twitter-sentiment-analysis"
version = "0.1.0"
description = "Multi-model Twitter sentiment analysis: Logistic Regression, LSTM, BiLSTM, CNN, and DistilBERT."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Sameer Tripathi"},
]
keywords = ["nlp", "sentiment-analysis", "twitter", "deep-learning", "transformers"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core runtime dependencies
dependencies = [
    "numpy~=1.26.4",
    "pandas~=2.2.2",
    "scipy~=1.13.0",
    "scikit-learn~=1.4.2",
    "tensorflow~=2.15.0",
    "torch~=2.2.2",
    "transformers~=4.40.0",
    "nltk~=3.8.1",
    "textblob~=0.18.0",
    "matplotlib~=3.9.0",
    "seaborn~=0.13.2",
    "plotly~=5.22.0",
    "wordcloud~=1.9.3",
    "streamlit~=1.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.2.0",
    "black~=24.4.2",
    "flake8~=7.0.0",
    "pre-commit~=3.7.1",
]

[project.urls]
Repository = "https://github.com/Sameer-2204/twitter-sentiment-analysis"

# ──────────────────────────────────────────────
# Setuptools package discovery
# ──────────────────────────────────────────────
[tool.setuptools.packages.find]
include = ["scripts*", "configs*"]

# ──────────────────────────────────────────────
# Tool configs
# ──────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
