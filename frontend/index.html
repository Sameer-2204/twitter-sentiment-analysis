<!doctype html>
<html lang="en" class="dark">
  <head>
    <script>
      // Prevent flash of wrong theme
      (function() {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.className = t;
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
            document.documentElement.className = 'light';
          }
        } catch(e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Twitter Sentiment Analyzer | NLP Dashboard</title>
    <meta name="description" content="Interactive dashboard for Twitter sentiment analysis using 5 ML/DL models including LSTM, BiLSTM, CNN, and DistilBERT. Explore EDA visualizations, compare model performance, and run real-time predictions." />
    <meta name="theme-color" content="#0a0a1a" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Twitter Sentiment Analyzer | NLP Dashboard" />
    <meta property="og:description" content="Interactive dashboard for Twitter sentiment analysis using 5 ML/DL models including LSTM, BiLSTM, CNN, and DistilBERT." />
    <meta property="og:image" content="/og-preview.png" />
    <meta property="og:url" content="https://twitter-sentiment-analysis.vercel.app" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Twitter Sentiment Analyzer | NLP Dashboard" />
    <meta name="twitter:description" content="Analyze tweet sentiment with 5 ML/DL models — Logistic Regression, LSTM, BiLSTM, CNN, DistilBERT." />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
